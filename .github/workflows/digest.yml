name: Daily digest

on:
  schedule:
    # 02:00 по Сан-Паулу (UTC−3). Не полночь намеренно: у DeepSeek
    # пиковый тариф в 01:00–04:00 и 06:00–10:00 UTC, вдвое дороже обычного,
    # и прежние 03:00 UTC попадали ровно в него. Окно 04:00–06:00 UTC —
    # единственная дешёвая щель между пиками; к утру выпуск всё равно готов.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Письмо дайджеста персонально, поэтому время растёт с числом читателей;
    # сбор и оценка идут один раз на всех и не растут.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Собрать, оценить, разослать
        env:
          # Строка пулера: у прямого хоста Supabase только IPv6,
          # а раннеры GitHub ходят по IPv4.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Нужен переносу владельца, не рассылке: уведомление уходит
          # в чат каждого читателя из dailynews.readers.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Без ключа выпуск не уходит на читалку, но прогон идёт.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LLM_INPUT_PRICE: ${{ vars.LLM_INPUT_PRICE }}
          LLM_OUTPUT_PRICE: ${{ vars.LLM_OUTPUT_PRICE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DB_POOL_MAX: '5'
        run: npx tsx pipeline/run.ts
