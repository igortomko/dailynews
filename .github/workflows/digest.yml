name: Daily digest

on:
  schedule:
    # 02:00 по Сан-Паулу (UTC−3). Не полночь намеренно: у DeepSeek
    # пиковый тариф в 01:00–04:00 и 06:00–10:00 UTC, вдвое дороже обычного,
    # и прежние 03:00 UTC попадали ровно в него. Окно 04:00–06:00 UTC —
    # единственная дешёвая щель между пиками; к утру выпуск всё равно готов.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Письмо дайджеста персонально, поэтому время растёт с числом читателей;
    # сбор и оценка идут один раз на всех и не растут.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Субтитры YouTube отдаются только жилым адресам: и с раннера GitHub,
      # и с VPS плеер отвечает «Sign in to confirm you're not a bot» на любой
      # клиент — проверено на обоих. WARP даёт исходящий адрес Cloudflare,
      # который YouTube принимает; поднимается за десять секунд и живёт
      # ровно этот прогон.
      #
      # Шаг не имеет права ронять выпуск: не поднялся — ролики остаются
      # с описанием из фида, о чём прогон скажет вслух. Поэтому YT_PROXY
      # выставляется только после того, как канал ответил.
      - name: Исходящий канал для субтитров (Cloudflare WARP)
        continue-on-error: true
        run: |
          docker run -d --name warp --memory=300m --cap-add NET_ADMIN \
            --device /dev/net/tun -p 127.0.0.1:1080:1080 caomingjun/warp
          for i in $(seq 1 18); do
            sleep 5
            if curl -s --max-time 8 -x http://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
              echo "YT_PROXY=http://127.0.0.1:1080" >> "$GITHUB_ENV"
              echo "WARP поднялся за $((i * 5)) с"
              exit 0
            fi
          done
          echo "WARP не поднялся: ролики останутся с описанием из фида" >&2
          exit 1

      - name: Собрать, оценить, разослать
        env:
          # Строка пулера: у прямого хоста Supabase только IPv6,
          # а раннеры GitHub ходят по IPv4.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Нужен переносу владельца, не рассылке: уведомление уходит
          # в чат каждого читателя из dailynews.readers.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Без ключа выпуск не уходит на читалку, но прогон идёт.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LLM_INPUT_PRICE: ${{ vars.LLM_INPUT_PRICE }}
          LLM_CACHE_INPUT_PRICE: ${{ vars.LLM_CACHE_INPUT_PRICE }}
          LLM_OUTPUT_PRICE: ${{ vars.LLM_OUTPUT_PRICE }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DB_POOL_MAX: '5'
        run: npx tsx pipeline/run.ts
